[package]
name = "cadrs_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Rebuild parts through the B-rep kernel (the native pure-Rust one). Without it, extrudes fall
# back to the old prism mesh.
default = ["brep"]
brep = []
# GPU compute in the kernel (mass properties of B-spline faces on Vulkan/Metal/DX12; the CPU
# when there is no GPU).
gpu = ["cadrs_kernel/gpu"]

[dependencies]
cadrs_fs.workspace = true
cadrs_sketch.workspace = true
cadrs_vars.workspace = true
cadrs_cam.workspace = true
cadrs_kernel.workspace = true
cadrs_fea.workspace = true
cadrs_render.workspace = true
cadrs_drawing.workspace = true
cadrs_idf.workspace = true
cadrs_eda.workspace = true
cadrs_sheetmetal.workspace = true
nalgebra.workspace = true
serde.workspace = true
uuid.workspace = true
ron.workspace = true
blake3.workspace = true
bincode.workspace = true
rmp-serde.workspace = true
# The wire form of shared documents (`collab::pack`).
flate2.workspace = true
image.workspace = true
directories.workspace = true
slotmap.workspace = true
# SVG drawings into sketches (vector_import).
resvg.workspace = true

zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
web-time.workspace = true
# The parts of one feature built side by side (`Rebuilder::per_part`).
rayon.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
tempfile = "3"
tiny-skia.workspace = true
serde_json.workspace = true

# Its own executable is the kernel process it starts (`rebuild::process`), so it has a `main`.
[[test]]
name = "kernel_process"
harness = false
