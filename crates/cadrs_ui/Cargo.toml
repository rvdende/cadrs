[package]
name = "cadrs_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cadrs_fs.workspace = true
bevy.workspace = true
# Icons at sizes not built in (a UI scale, a high-DPI screen), rendered like `build.rs` does.
resvg.workspace = true
icon-rs.workspace = true
# The system's file dialogs and the user's folders (`file_picker`).
rfd.workspace = true
directories.workspace = true
raw-window-handle.workspace = true

[build-dependencies]
resvg.workspace = true
icon-rs.workspace = true

# The browser's file chooser (`file_picker`, in a page).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

# Bevy's parts a desktop needs and a page doesn't (it has one thread and no X11 or Wayland).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded", "x11", "wayland"] }
