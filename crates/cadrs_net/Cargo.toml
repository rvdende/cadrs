[package]
name = "cadrs_net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy.workspace = true
bevy_iroh.workspace = true
# Public documents: a revision's hash, signed in its listing.
blake3.workspace = true
cadrs_core.workspace = true
# Public documents are kept next to the documents (in a page too).
cadrs_fs.workspace = true
# The persistent face, edge and vertex names a selection travels by (`session::Picked`).
cadrs_sketch.workspace = true
data-encoding.workspace = true
postcard.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
n0-future.workspace = true
uuid.workspace = true


# The browser build (`tools/web`): bevy_iroh's endpoint over the relays, its key in the page's
# storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_iroh = { workspace = true, features = ["wasm"] }

[features]
# Voice while editing together: bevy_iroh's media (cpal, libopus and openh264, built from
# source with cmake). Off by default; `cargo build -r -F voice` on the app.
voice = ["bevy_iroh/media"]
