[package]
name = "cadrs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
bevy.workspace = true
# The online part search (`easyeda`) asks JLCPCB over plain HTTP: not in the browser build.
cadrs_app = { workspace = true, default-features = false, features = ["kicad"] }
cadrs_core.workspace = true
cadrs_harness.workspace = true
cadrs_net.workspace = true
cadrs_ui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cadrs_app = { workspace = true, features = ["easyeda"] }

# The browser build (`tools/web`) draws with WebGPU (Bevy then leaves WebGL2 out).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
cadrs_fs.workspace = true
# The page's address (`?quick-start`).
js-sys.workspace = true

[features]
default = ["gpu", "profiler"]
# The kernel's GPU compute (see cadrs_kernel's `gpu` feature): off unless `CADRS_GPU=1` (it lost
# to the CPU's cores on a real Part Studio's rebuild).
gpu = ["cadrs_core/gpu"]
# A span for every system and schedule run, so the frame panel and `get_frame_stats` show
# where a frame's CPU time goes (`cadrs_app::frame_profile`); `debug` keeps the systems' names.
profiler = ["bevy/trace", "bevy/debug"]
# Faster dev builds: Bevy as a shared library (`cargo run -F dev`). Not for shipped builds.
dev = ["bevy/dynamic_linking"]
# Voice while editing together: bevy_iroh's media (libopus and openh264 built with cmake, the
# microphone through cpal). Off by default.
voice = ["cadrs_app/voice"]
# The app's tests (they build the whole app): a plain `cargo test` leaves them out.
app-tests = []

[[bin]]
name = "cadrs"
path = "src/main.rs"
test = false

[[test]]
name = "startup"
required-features = ["app-tests"]

[[test]]
name = "golden"
required-features = ["app-tests"]

[dev-dependencies]
image.workspace = true
