[package]
name = "cadrs_social"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Accounts, devices, organizations' signed logs and the social protocol of cadrs, without Bevy or the kernel (so the phone app can use it)"

[dependencies]
blake3.workspace = true
cadrs_fs.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
postcard.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
openmls = { workspace = true, features = ["js"] }
# openmls's RustCrypto provider draws on rand 0.8, which needs getrandom 0.2's browser backend.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
proptest.workspace = true
