[package]
name = "cadrs_kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Solid-modeling layer for cadrs: a pure-Rust B-rep kernel behind our own API"

[dependencies]
nalgebra = { workspace = true, features = ["serde-serialize"] }
serde.workspace = true
uuid.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
spade = "2.15"
cadrs_gpu = { path = "../cadrs_gpu", optional = true }
web-time.workspace = true

[lints.rust]
unsafe_code = "deny"

# `tools/kernel_clippy.sh` gates `cargo clippy -p cadrs_kernel --all-targets` on these plus the
# defaults, warnings denied.
[lints.clippy]
# NaN-safe guards are written `!(x > 0.0)` (true for NaN); the `partial_cmp` form the lint asks
# for reads worse.
neg_cmp_op_on_partial_ord = "allow"

[dev-dependencies]
# The crate's own test kit (`native::draw`, `native::oracle`) for its integration tests.
cadrs_kernel = { path = ".", features = ["testkit"] }
proptest.workspace = true

[features]
# Test-only code: the DRAW harness the generated OCCT suites run on and the SMLib oracle's body
# writer. Not part of the kernel's API; the crate's own tests turn it on.
testkit = []
# GPU compute (Vulkan/Metal/DX12 through wgpu, rust-gpu kernels): large batches of the
# mass-property quadrature on B-spline faces. Falls back to the CPU without a GPU.
gpu = ["dep:cadrs_gpu"]

