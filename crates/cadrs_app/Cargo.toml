[package]
name = "cadrs_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cadrs_fs.workspace = true
blake3.workspace = true
resvg.workspace = true
bevy.workspace = true
cadrs_core.workspace = true
cadrs_sheetmetal.workspace = true
cadrs_sketch.workspace = true
cadrs_vars.workspace = true
cadrs_ui.workspace = true
chrono.workspace = true
image.workspace = true
cadrs_drawing.workspace = true
cadrs_kernel.workspace = true
cadrs_pcb.workspace = true
cadrs_idf.workspace = true
cadrs_fea.workspace = true
cadrs_render.workspace = true
nalgebra.workspace = true
uuid.workspace = true
serde.workspace = true
ron.workspace = true
cadrs_eda.workspace = true
cadrs_router.workspace = true
# KiCad project import: a crutch that can be dropped (remove the feature and `pcb::kicad`).
cadrs_kicad = { workspace = true, optional = true }
cadrs_net.workspace = true
serde_json.workspace = true
directories.workspace = true
winit.workspace = true
flate2.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Not in the browser build (`tools/web`): the MCP server listens on a port, updates replace the
# executable, and the online part search asks JLCPCB over plain HTTP.
web-time.workspace = true
# A page opens links with `window.open` (`open_url`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cadrs_mcp.workspace = true
cadrs_easyeda = { workspace = true, optional = true }
# Updates from GitHub releases (`update`).
ureq.workspace = true
tar.workspace = true

[dev-dependencies]
# The network button's icons exist (`network`).
icon-rs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client.workspace = true
wayland-backend.workspace = true
raw-window-handle.workspace = true
# Pure Rust client for the FreeSpacenav daemon protocol (no system libspnav link dependency).
spnav-rs = "0.1.1"
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Read 3Dconnexion devices directly: the 3DxWare SDK is not redistributable with CADrs and is
# not included in the driver installation. Keep this backend out of non-Windows builds.
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[features]
default = ["kicad", "easyeda"]
kicad = ["dep:cadrs_kicad"]
# The online part search (JLCPCB/LCSC, EasyEDA parts) in the library browser.
easyeda = ["dep:cadrs_easyeda"]
# Voice while editing together (`collab::voice`; cadrs_net's `voice`).
voice = ["cadrs_net/voice"]
