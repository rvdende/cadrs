name: Pages

# https://cadrs.net is the app itself, full screen: the latest release's browser build
# (tools/web/build.sh, attached to every release as cadrs-web.tar.gz) at the site's root. In a
# browser without WebGPU the page offers the downloads instead (tools/web/index.html). /app/,
# where the app used to be, and any path there is no page for go to it. Deployed when a release
# is published (the release workflow also asks for it), when this file changes, and by hand.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The latest release's browser build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "${{ github.repository }}" --pattern cadrs-web.tar.gz \
            --dir "$RUNNER_TEMP"
          mkdir -p site
          tar -xzf "$RUNNER_TEMP/cadrs-web.tar.gz" -C site --strip-components=1
          test -f site/index.html
          # Where the app used to be, and pages that are no more: to the app, keeping the query
          # (/app/?quick-start).
          redirect='<!doctype html><meta charset="utf-8"><title>cadrs</title><link rel="canonical" href="https://cadrs.net/"><script>location.replace("/" + location.search + location.hash)</script><noscript><meta http-equiv="refresh" content="0; url=/"></noscript><a href="/">cadrs</a>'
          mkdir -p site/app
          printf '%s\n' "$redirect" > site/app/index.html
          printf '%s\n' "$redirect" > site/404.html
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
