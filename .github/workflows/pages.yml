name: Pages

# https://cadrs.net is the app itself, full screen: the browser build (tools/web/build.sh) of
# main at the site's root, built and deployed once CI has passed on a push to main (and by hand,
# on main; never from another branch): the site is the latest main whose checks all pass (its
# tests, the kernel's gate, no regressions on brep-bench or brep-conformance). A push whose CI
# fails, or is cancelled by a newer push, leaves the site as it was. It draws with WebGPU, or
# WebGL2 where the browser has no WebGPU; with neither the page offers the downloads instead
# (tools/web/index.html). /app/, where the app used to be, and any path there is no page for go
# to it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    # Only main: after CI, a push to main whose run passed; by hand, run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The commit CI passed (main may have moved on since).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # clang and mold link the build scripts (.cargo/config.toml's host settings).
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends clang mold < /dev/null

      # The nightly pinned in rust-toolchain.toml, with its wasm32 target.
      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      # wasm-bindgen's command line has to match the crate in Cargo.lock.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: pages-web

      - name: Build
        # rustc's default LTO (.cargo/config.toml turns it off for local builds; tagged releases
        # build with fat LTO).
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: tools/web/build.sh site

      - name: Redirects
        run: |
          set -euo pipefail
          test -f site/index.html
          # Where the app used to be, and pages that are no more: to the app, keeping the query
          # (/app/?quick-start).
          redirect='<!doctype html><meta charset="utf-8"><title>cadrs</title><link rel="canonical" href="https://cadrs.net/"><script>location.replace("/" + location.search + location.hash)</script><noscript><meta http-equiv="refresh" content="0; url=/"></noscript><a href="/">cadrs</a>'
          mkdir -p site/app
          printf '%s\n' "$redirect" > site/app/index.html
          printf '%s\n' "$redirect" > site/404.html
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
