name: CI

on:
  push:
    branches: [main, 'kernel-*']
  pull_request:
  # A merge queue runs the required checks on the merged result.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cached target folder small: no incremental state, less debug info.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # .cargo/config.toml's Linux flags without -Zthreads=8: an 8-thread front end per rustc, on a
  # 4-core runner building 4 crates at once, takes more memory than it has (the build was
  # killed, exit 143). The target's variable replaces the config's flags for Linux only.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold -Zshare-generics=y

jobs:
  # Per push and pull request: every crate is rustfmt-clean (default style; run `cargo fmt --all`
  # before committing). Mark "Format" as a required status check too.
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install && cargo fmt --version

      - name: cargo fmt (workspace)
        run: cargo fmt --all --check

  # Per push and pull request: the user documentation (docs/, https://cadrs.net/docs/) builds. Its
  # reference pages made from the code are checked by cadrs_app's docs_reference tests.
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: mdbook build
        run: mdbook build docs

  # Per push and pull request: the kernel's builds without the test feature, its clippy gate and
  # a fast subset of the gate (tools/kernel_gate.sh: the unit tests, conformance, smlib_booleans,
  # validity and determinism, classified as the full gate does: a regression, a stale or
  # panicking known failure, a hang or a crash fails it); any failed step fails the job. It is the merge requirement for main and kernel-10: mark "Kernel (checks, clippy, fast
  # gate)" as a required status check in both branches' protection rules (Settings > Branches),
  # with "Build and test (Linux)" for main.
  kernel:
    name: Kernel (checks, clippy, fast gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel

      # The library without the tests' `testkit` feature (every test enables it), and the
      # kernel's real consumer.
      - name: Check (kernel without features, cadrs_core)
        run: cargo check -p cadrs_kernel && cargo check -p cadrs_core

      # The kernel is kept clippy-clean (warnings denied; lint levels in its Cargo.toml).
      - name: Clippy (kernel)
        run: tools/kernel_clippy.sh

      # The checks ran above (--no-checks).
      - name: Fast gate (lib, conformance, smlib_booleans, validity, determinism, issue_reports)
        env:
          RUST_TEST_THREADS: 4
        run: |
          tools/kernel_gate.sh --tree . --commit "$GITHUB_SHA" --out "$GITHUB_WORKSPACE/kernel_gate" \
            --no-checks --only lib,conformance,smlib_booleans,validity,determinism,issue_reports --hang 600

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-fast-gate
          path: |
            kernel_gate/results.json
            kernel_gate/summary.txt
            kernel_gate/stderr.log

  test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The whole workspace's debug build outgrew the runner's memory (16 GB) when the kernel
      # grew: the runner was killed, or lost, mid-build. With swap it runs slower instead.
      - name: Swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config clang mold \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # The nightly pinned in rust-toolchain.toml (.cargo/config.toml links with mold and uses a
      # nightly flag).
      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      # OpenCASCADE is built from source on the first run (several minutes); the cache keeps it.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      # The committed icons (crates/cadrs_icons) match their drawing functions in cadrs_icons_gen.
      - name: Icons up to date
        run: cargo run -q -p cadrs_icons_gen -- --check

      # Unit tests only: each integration test (`crates/*/tests`) links Bevy and OpenCASCADE into
      # its own large binary, too much for a hosted runner's disk. Run them locally with
      # `cargo test --workspace`.
      - name: Test
        run: cargo test --workspace --exclude cadrs --lib

  # Per push and pull request: every app scenario (scenarios/*.ron) run headless with no GPU
  # (`cadrs --headless --no-gpu`: nothing is drawn, the UI, input and the document run as usual),
  # checked by its steps (ExpectValue on a part's volume and area, ExpectText, …) and the tests'
  # own checks (crates/cadrs/tests/scenarios.rs). The few that compare screenshots need a GPU and
  # are skipped here (CADRS_SKIP_IMAGES); run them locally. Release, as locally: debug apps are
  # too slow for the scenarios' step timeouts. The scenarios test binary links no Bevy (the
  # package has no library), so the disk holds the one app.
  scenarios:
    name: Scenarios (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config clang mold \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: scenarios

      - name: Build
        run: cargo test -r -p cadrs -F app-tests --test scenarios --no-run

      - name: Scenarios
        env:
          CADRS_SKIP_IMAGES: 1
        run: cargo test -r -p cadrs -F app-tests --test scenarios -- --ignored

  # Per push and pull request: brep-conformance's suite (springcraft-ai/brep-conformance, at the
  # commit tools/conformance pins) run on this kernel in process (tools/conformance's
  # `examples/suite.rs`), and no case that passes in tools/ci/conformance.baseline.json fails
  # (tools/ci/regressions.py; gains are listed: move the baseline with `--update` and commit it).
  conformance:
    name: Conformance (no regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance
          workspaces: tools/conformance -> target

      - name: The suite, on this kernel
        working-directory: tools/conformance
        run: |
          cargo run --release --locked --example suite -- \
            --out "$GITHUB_WORKSPACE/conformance.json" | tee "$GITHUB_WORKSPACE/conformance.txt"

      - name: No regressions
        run: |
          python3 tools/ci/regressions.py conformance.json tools/ci/conformance.baseline.json \
            --name brep-conformance

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: |
            conformance.json
            conformance.txt

  # Per push and pull request: brep-bench (bmander/brep-bench, at BREP_BENCH_REV) graded on this
  # kernel: its cadrs runner (kernels/cadrs) built against this checkout's cadrs_kernel (a
  # [patch] of the git dependency it pins), every case run by its harness (each STEP measured to
  # 1e-6), and no case that passes in tools/ci/brep-bench.baseline.json fails. The two are
  # checked out side by side: inside cadrs's tree, the runner would be taken for a member of
  # cadrs's workspace. Moving BREP_BENCH_REV can add cases (listed as new) or change them: run it
  # and move the baseline with the same commit.
  brep-bench:
    name: brep-bench (no regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BREP_BENCH_REV: 4273a001e20fdac3667315eb03f2e73950452d88
      # Built outside cadrs's tree, where .cargo/config.toml (clang, mold) doesn't reach: no
      # flags, as before the workflow's Linux flags.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          path: cadrs

      - uses: actions/checkout@v4
        with:
          repository: bmander/brep-bench
          ref: ${{ env.BREP_BENCH_REV }}
          path: brep-bench

      # The nightly cadrs pins, for the runner too (it lies outside cadrs's tree, where
      # rust-toolchain.toml doesn't reach).
      - name: Rust toolchain
        working-directory: cadrs
        run: |
          rustup toolchain install && rustc -V
          echo "RUSTUP_TOOLCHAIN=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: The cadrs runner on this kernel
        run: |
          cat >> brep-bench/kernels/cadrs/Cargo.toml <<EOF

          [patch."https://github.com/rvdende/cadrs"]
          cadrs_kernel = { path = "$GITHUB_WORKSPACE/cadrs/crates/cadrs_kernel" }
          EOF

      - uses: Swatinem/rust-cache@v2
        with:
          key: brep-bench
          workspaces: brep-bench/kernels/cadrs -> target

      # (harness/run.py runs the built runner; build.py builds it, and reports a failure
      # without failing: the runner must be there.)
      - name: Build the runner
        working-directory: brep-bench
        run: |
          python3 harness/build.py cadrs
          test -x kernels/cadrs/target/release/brep-bench-cadrs

      - name: Every case
        working-directory: brep-bench
        run: python3 harness/run.py --kernel cadrs --timeout 300

      - name: No regressions
        run: |
          python3 cadrs/tools/ci/regressions.py brep-bench/results/cadrs.json \
            cadrs/tools/ci/brep-bench.baseline.json --name brep-bench

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brep-bench
          path: brep-bench/results/cadrs.json

  # The browser build (tools/web) compiles: code that also runs in a page reads files through
  # cadrs_fs, tells the time with web_time and starts no threads (CLAUDE.md), which a native build
  # can't check.
  web:
    name: Check (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # clang and mold link the build scripts (.cargo/config.toml's host settings).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      # With tools/web/build.sh's features: the WebGPU build, then the WebGL2 one.
      - name: Check
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p cadrs --no-default-features -F gpu,webgpu
          cargo check --locked --target wasm32-unknown-unknown -p cadrs --no-default-features

  macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: brew install cmake

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2

      # Build only: the tests run on Linux, and building them again here took the job past its
      # two hours on a cold cache.
      - name: Build
        run: cargo build --workspace
