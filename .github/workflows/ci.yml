name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cached target folder small: no incremental state, less debug info.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      # OpenCASCADE is built from source on the first run (several minutes); the cache keeps it.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      # Unit tests only: each integration test (`crates/*/tests`) links Bevy and OpenCASCADE into
      # its own large binary, too much for a hosted runner's disk. Run them locally with
      # `cargo test --workspace`.
      - name: Test
        run: cargo test --workspace --exclude cadrs --lib
