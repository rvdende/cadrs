name: Release

# Pushing a version tag (`git tag v0.1.6 && git push origin v0.1.6`) builds the Linux and Windows
# archives, as tools/release/build.sh does locally, the Windows installer (tools/windows/cadrs.iss),
# the macOS disk image (#103) and the browser build (tools/web), and publishes them as a GitHub release with SHA256SUMS.txt. The release notes are
# tools/release/notes/<tag>.md (GitHub's generated notes when there is none); a tag with a `-` in
# it (v0.1.7-beta.1) is a pre-release. (The site, https://cadrs.net, is main's, deployed once CI
# passes on a push to main: .github/workflows/pages.yml.) Running it by hand with a tag (Actions › Release › Run workflow) releases the
# chosen branch's head and creates the tag; with "Only build" ticked it publishes nothing, and the
# archives are the run's artifacts (to try a build before releasing it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to create and release, such as v0.1.6"
        required: true
      dry_run:
        description: "Only build: no tag and no release (the archives are the run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Fat LTO for the fastest code (.cargo/config.toml turns LTO off for local builds).
  CARGO_PROFILE_RELEASE_LTO: fat

jobs:
  # On Ubuntu 22.04, so the binary needs only glibc 2.35, on the nightly pinned in
  # rust-toolchain.toml (what development builds use, so the release compiles what they do), but
  # without .cargo/config.toml's mold and nightly flags (no mold on 22.04).
  linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUSTFLAGS: ""
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-linux

      - name: Build
        run: cargo build --release --locked -p cadrs

      - name: Package
        run: tools/release/package.sh linux target/release/cadrs

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  # Cross-built with MinGW (its windres compiles the icon into cadrs.exe), on the nightly pinned
  # in rust-toolchain.toml, which carries the Windows target. On Ubuntu 26.04, for MinGW's
  # binutils 2.45: the cadrs.exe that 24.04's binutils 2.41 linked doesn't start on Windows.
  windows:
    name: Build (Windows)
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # clang and mold link the build scripts (.cargo/config.toml's host settings). Without a
      # prompt or a man-db rebuild, either of which can stall apt for good.
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            clang mold gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip < /dev/null

      - name: Check the MinGW linker
        run: |
          x86_64-w64-mingw32-ld --version | head -1
          ld="$(x86_64-w64-mingw32-ld --version | sed -n '1s/.* \([0-9]*\.[0-9]*\).*/\1/p')"
          [[ "$(printf '%s\n' 2.45 "$ld" | sort -V | head -1)" == 2.45 ]] || { echo "MinGW binutils $ld is older than 2.45"; exit 1; }

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-windows

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p cadrs

      - name: Package
        run: tools/release/package.sh windows target/x86_64-pc-windows-gnu/release/cadrs.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  # The Windows installer (tools/windows/cadrs.iss): the zip's files wrapped by Inno Setup, which
  # GitHub's Windows runners have, into cadrs-v<version>-x86_64-windows-setup.exe. Per user, into
  # the folder `cadrs --install` uses, with a Start Menu entry; the updater keeps using the zip.
  windows-installer:
    name: Installer (Windows)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: zip

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "no Inno Setup at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Expand-Archive -Path "zip\cadrs-v$version-x86_64-windows.zip" -DestinationPath unpacked
          $source = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$source\cadrs.exe")) { throw "no cadrs.exe in the zip" }
          & $env:ISCC /Qp "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$PWD\dist" tools\windows\cadrs.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      # Installed and uninstalled silently, as a check that both run and leave things as they
      # should be.
      - name: Install and uninstall
        shell: pwsh
        run: |
          $setup = (Get-Item dist\*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\cadrs"
          foreach ($f in "$app\cadrs.exe", "$app\libraries", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\cadrs.lnk") {
            if (-not (Test-Path $f)) { throw "not installed: $f" }
          }
          & "$app\cadrs.exe" --help | Out-Null
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.cadrs').'(default)' -ne 'cadrs.Document') { throw ".cadrs isn't cadrs's" }
          # (The uninstaller runs from a copy of itself in a temporary folder and returns at once.)
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          foreach ($f in $app, "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\cadrs.lnk", 'HKCU:\Software\Classes\cadrs.Document') {
            if (Test-Path $f) { throw "left after uninstalling: $f" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # On Apple silicon, for Apple silicon and Intel: both built (Apple's toolchain cross-builds
  # Intel) on the nightly pinned in rust-toolchain.toml, joined into one universal executable, and
  # packed as cadrs.app in a disk image, for macOS 11 and later. Signed ad hoc (no Apple
  # Developer ID yet), so macOS asks once before it opens it (the release notes say how).
  macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: brew install cmake

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-macos

      - name: Build (Apple silicon)
        run: cargo build --release --locked -p cadrs --target aarch64-apple-darwin

      - name: Build (Intel)
        run: cargo build --release --locked -p cadrs --target x86_64-apple-darwin

      - name: Universal executable
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/cadrs \
            target/aarch64-apple-darwin/release/cadrs target/x86_64-apple-darwin/release/cadrs
          lipo -info target/universal/cadrs

      - name: Package
        run: tools/release/package.sh macos target/universal/cadrs

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  # The browser build (tools/web/build.sh): the app as WebAssembly, drawn with WebGPU or WebGL2,
  # attached to the release. (The site is main's: .github/workflows/pages.yml.)
  web:
    name: Build (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # clang and mold link the build scripts (.cargo/config.toml's host settings).
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends clang mold < /dev/null

      # The nightly pinned in rust-toolchain.toml, with its wasm32 target.
      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      # wasm-bindgen's command line has to match the crate in Cargo.lock.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-web

      - name: Build
        run: tools/web/build.sh target/web

      - name: Package
        run: tools/release/package.sh web target/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, windows, windows-installer, macos, web]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # The archives are named after Cargo.toml's version, so the tag has to match it.
      - name: Check the tag
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$TAG" == "v$version" ]] || { echo "tag $TAG doesn't match Cargo.toml's version $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each file again under its name without the version (cadrs-x86_64-linux.tar.gz), so a link
      # to releases/latest/download/<name> always fetches the latest release's (the README's
      # download buttons).
      - name: Names without the version
        run: |
          cd dist
          for f in cadrs-"$TAG"-*; do cp "$f" "${f/-$TAG/}"; done
          ls -l

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip *.exe *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        run: |
          set -euo pipefail
          # A tag push has its tag; a run by hand creates it on the commit it built.
          args=(--title "cadrs $TAG")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          notes="tools/release/notes/$TAG.md"
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.exe dist/*.dmg dist/SHA256SUMS.txt "${args[@]}"

      # Posts the release to the Discord server's #announcements (the webhook in the repository
      # secret DISCORD_RELEASES_WEBHOOK): the notes' first paragraph and the release's link. A
      # failure here doesn't fail the release, which is out by then.
      - name: Announce on Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          set -euo pipefail
          [[ -n "$WEBHOOK" ]] || { echo "no DISCORD_RELEASES_WEBHOOK secret"; exit 0; }
          notes="tools/release/notes/$TAG.md"
          summary=""
          if [[ -f "$notes" ]]; then summary="$(awk 'NF{p=1} p&&!NF{exit} p' "$notes" | head -c 1500)"; fi
          kind="cadrs $TAG is out"
          if [[ "$TAG" == *-* ]]; then kind="cadrs $TAG (pre-release) is out"; fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          content="$(printf '**%s**\n%s\n\nDownloads and notes: <%s>\nIn the browser: <https://cadrs.net>' "$kind" "$summary" "$url")"
          jq -n --arg c "$content" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- "$WEBHOOK"
