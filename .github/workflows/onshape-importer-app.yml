name: Onshape importer app

# Builds the desktop transfer app on a Linux runner and keeps the AppImage as an artifact; a
# tag like onshape-importer-v0.1.8 also publishes it as a GitHub Release asset, which is where
# people can actually download an AppImage (GitHub has no "Builds" tab; artifacts live under
# Actions, release assets under Releases).
#
# Run it from Actions → "Onshape importer app" → Run workflow, or push a tag:
#   git tag onshape-importer-v0.1.8 && git push <your-fork> onshape-importer-v0.1.8
on:
  workflow_dispatch:
  push:
    tags: ['onshape-importer-v*']

permissions:
  contents: read

jobs:
  appimage:
    name: Build and package the AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold zip

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, test and package
        run: tools/onshape/build.sh

      - name: Upload the AppImage as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadrs-onshape-importer-appimage
          path: tools/onshape/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish the AppImage on the tag's release
    if: startsWith(github.ref, 'refs/tags/onshape-importer-v')
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cadrs-onshape-importer-appimage
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
