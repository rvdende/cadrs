# Faster Linux builds (https://bevy.org/learn/quick-start/getting-started/setup/): link with mold,
# share monomorphized generics between crates, and run rustc's front end on 8 threads (both
# nightly). The Linux release build has no mold: release.yml and tools/release/build.sh turn
# these off there.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Zshare-generics=y", "-Zthreads=8"]

[alias]
# Builds in release and installs it for the current user, with a launcher entry (Linux; see
# crates/cadrs/src/install.rs).
install-local = "run -r -p cadrs -- --install"
# The gears tester (crates/cadrs_core/tests/gears_tester.rs): every generated gear family over a
# grid of inputs, as a table. GEARS=hypoid,worm,bevel picks families, JOBS=n the threads.
gears-tester = "test -r -p cadrs_core --test gears_tester -- --ignored --nocapture"
