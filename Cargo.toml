[workspace]
resolver = "3"
members = ["crates/*"]
# Patched dependencies (see each one's CADRS.md), not ours to lint or format.
exclude = ["vendor"]
# `cargo build -r` / `cargo run -r` build and run the app (crates/cadrs); `cargo test -r` runs
# the fast tests of the crates without Bevy. The app's own tests need the `app-tests` feature
# (`cargo test -r -p cadrs -F app-tests`); the golden screenshot tests are also `#[ignore]`d.
# cadrs_onshape (the Onshape importer, a second binary) is left out so `cargo run` stays
# unambiguous: `cargo test -r -p cadrs_onshape`.
default-members = [
    "crates/cadrs",
    "crates/cadrs_cam",
    "crates/cadrs_core",
    "crates/cadrs_drawing",
    "crates/cadrs_eda",
    "crates/cadrs_easyeda",
    "crates/cadrs_fea",
    "crates/cadrs_fs",
    "crates/cadrs_idf",
    "crates/cadrs_kicad",
    "crates/cadrs_kernel",
    "crates/cadrs_mcp",
    "crates/cadrs_pcb",
    "crates/cadrs_render",
    "crates/cadrs_router",
    "crates/cadrs_router_kernels",
    "crates/cadrs_sheetmetal",
    "crates/cadrs_sketch",
    "crates/cadrs_vars",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rvdende/cadrs"

[workspace.dependencies]
bevy = { version = "0.20.1", features = ["bevy_dev_tools", "system_clipboard"] }
serde = { version = "1", features = ["derive", "rc"] }
ron = "0.12"
# The kernel process's messages (`cadrs_core::rebuild::process`): self-describing, so the
# documents' optional fields round-trip.
rmp-serde = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
# The autorouter's GPU search (cadrs_router): the wgpu Bevy uses, taking SPIR-V from rust-gpu.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "spirv", "vulkan", "metal", "dx12"] }
futures-lite = "2"
bytemuck = "1"
slotmap = { version = "1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
resvg = "0.45"
icon-rs = "0.5"
directories = "6"
# The system's file dialogs (cadrs_ui::file_picker, issue #136): on Linux through the desktop
# portal (zenity when there is none), pure Rust.
rfd = "0.17"
# Wayland file drops (`cadrs_app::file_drop`): winit has no Wayland drag-and-drop, so the app
# reads drops off winit's own Wayland connection. The versions winit already pulls in.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
# The window icon (cadrs_app::app_icon); the version Bevy uses.
winit = { version = "0.30", default-features = false }
earcutr = "0.4"
proptest = "1"
# `wasmbind`: the clock in a browser (JavaScript's Date; nothing elsewhere).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
ttf-parser = "0.25"
# Sheet metal flat patterns (P3I.1): 2D polygon booleans for the flat outline, reliefs and the
# collision check (MIT/Apache-2.0).
geo = "0.32"
# Electronics (cadrs_eda): Clipper2 polygon booleans and offsets on i64 (Boost licence) for zone
# fill, clearances and DRC; gerber_parser checks our Gerber output in tests (MIT/Apache-2.0).
clipper2-rust = "1.2"
gerber_parser = "0.5"
tiny-skia = "0.11"
flate2 = "1"
# P3F.5 (simulation): sparse Cholesky (MIT), exact geometric predicates (MIT/Apache-2.0),
# data parallelism (MIT/Apache-2.0). faer's own threads (its `rayon` feature) are cadrs_fea's,
# off in the browser build.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
robust = "1.2"
rayon = "1"
serde_json = "1"
# HTTP for the online part search (cadrs_easyeda; rustls, MIT/Apache-2.0).
ureq = "3"
# The app's updates unpack the Linux release archive (.tar.gz; MIT/Apache-2.0).
tar = "0.4"
# Blob keys (cadrs_core), and Bevy's asset hashing through feature unification: `pure` skips
# blake3's C/assembly SIMD code, so there is one less C build. The keys hash small inputs.
blake3 = { version = "1", features = ["pure"] }
bincode = "1"
base64 = "0.22"
# The MCP server (cadrs_mcp): the official Rust SDK over Streamable HTTP, served by axum on a
# tokio runtime of its own (MIT/Apache-2.0).
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# Each crate names the features it uses: cadrs_net's (sync) also build for the browser, where
# tokio has no network.
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Sharing and collaboration (cadrs_net): peers over iroh, no server. Only the transport, rooms
# and typed messages; the voice and video features stay off (MIT/Apache-2.0).
bevy_iroh = { version = "0.5", default-features = false }
# Share links (cadrs_net): postcard, then base32 so a link survives a chat client.
postcard = { version = "1.1", features = ["alloc"] }
data-encoding = "2"
# Clocks that also run in the browser (`std::time::Instant::now` panics there); std's own
# types on other targets, and the `Instant` Bevy uses.
web-time = "1"
# The browser build's glue (`cadrs_fs`, `cadrs`'s page): the versions Bevy and wgpu use.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Timeouts on every target (cadrs_net): tokio's timer needs its runtime, which a browser has not.
n0-future = "0.3"

cadrs_core = { path = "crates/cadrs_core" }
cadrs_fs = { path = "crates/cadrs_fs" }
cadrs_cam = { path = "crates/cadrs_cam" }
cadrs_sketch = { path = "crates/cadrs_sketch" }
cadrs_vars = { path = "crates/cadrs_vars" }
cadrs_ui = { path = "crates/cadrs_ui" }
cadrs_net = { path = "crates/cadrs_net" }
cadrs_app = { path = "crates/cadrs_app" }
cadrs_harness = { path = "crates/cadrs_harness" }
cadrs_kernel = { path = "crates/cadrs_kernel" }
cadrs_drawing = { path = "crates/cadrs_drawing" }
cadrs_eda = { path = "crates/cadrs_eda" }
cadrs_router = { path = "crates/cadrs_router" }
cadrs_router_kernels = { path = "crates/cadrs_router_kernels" }
cadrs_kicad = { path = "crates/cadrs_kicad" }
cadrs_easyeda = { path = "crates/cadrs_easyeda" }
cadrs_idf = { path = "crates/cadrs_idf" }
cadrs_pcb = { path = "crates/cadrs_pcb" }
cadrs_fea = { path = "crates/cadrs_fea" }
cadrs_render = { path = "crates/cadrs_render" }
cadrs_onshape = { path = "crates/cadrs_onshape" }
cadrs_sheetmetal = { path = "crates/cadrs_sheetmetal" }
cadrs_mcp = { path = "crates/cadrs_mcp" }

# Small optimization for our own code, full optimization for dependencies (Bevy is slow in pure debug).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The FEA solver's element loops are too slow at opt-level 1 (P3F.5).
[profile.dev.package.cadrs_fea]
opt-level = 3
# The path tracer too (P3F.6).
[profile.dev.package.cadrs_render]
opt-level = 3

# Kernel iteration (`cargo test --profile kernel -p cadrs_kernel`): release-level optimisation for
# the geometry tests, but incremental and with more codegen units, so an edit to one module
# recompiles in seconds instead of rebuilding the crate.
[profile.kernel]
inherits = "release"
incremental = true
codegen-units = 64

[patch.crates-io]
# wgpu's upload staging in system memory, not the PCIe BAR (vendor/gpu-allocator/CADRS.md).
gpu-allocator = { path = "vendor/gpu-allocator" }
