[package]
name = "cadrs-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The cadrs adapter for brep-conformance's B-rep protocol, and the suite run in process"
publish = false

# A workspace of its own: cadrs's builds don't pay for the suite, and the suite's builds don't
# touch cadrs's target directory.
[workspace]

[[bin]]
name = "cadrs-adapter"
path = "src/main.rs"

[dependencies]
# The protocol at the suite's commit, so the in-process runner and the adapter share its types.
brep-protocol = { git = "https://github.com/springcraft-ai/brep-conformance", rev = "54d1c8e0022022a301c51623efc43c37016db761" }
cadrs_kernel = { path = "../../crates/cadrs_kernel" }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

[profile.release]
debug = "line-tables-only"
incremental = true

[dev-dependencies]
# The suite's cases and checks, run in process by `examples/suite.rs`.
brep-conformance = { git = "https://github.com/springcraft-ai/brep-conformance", rev = "54d1c8e0022022a301c51623efc43c37016db761" }
serde_json = "1"
